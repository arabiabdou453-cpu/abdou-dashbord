services:
  postgres:
    image: postgres:16-alpine
    container_name: abdou-dashbord-db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-evershop}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres_secure_pwd}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-evershop}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: abdou-dashbord-app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-evershop}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres_secure_pwd}
      DB_SSLMODE: disable
      PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      - app_media:/app/media

volumes:
  postgres_data:
  app_media:
